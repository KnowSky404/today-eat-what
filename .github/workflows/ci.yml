name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build H5 (root path)
        run: bun run build:h5
      - name: Build H5 (GitHub Pages subpath)
        run: |
          bun run build:pages
          grep -q '/today-eat-what/' dist/index.html
      - name: Install Chinese fonts for visual snapshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install browsers for runtime smoke test
        run: bunx playwright install chromium firefox
      - name: Browser smoke test (Chromium & Firefox)
        run: bun run smoke:h5
      - name: Upload responsive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: artifacts/layout/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build WeChat Mini Program
        run: bun run build:weapp

  workers-build:
    permissions:
      contents: write
    name: Validate Cloudflare Workers Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun install
      - name: Build Workers H5 (root path)
        run: |
          bun run build:workers
          test -f dist/index.html
          grep -q '/js/' dist/index.html
          if grep -q '/today-eat-what/js/' dist/index.html; then
            echo 'Workers assets must use root paths, not GitHub Pages paths.' >&2
            exit 1
          fi
      - name: Validate Worker deployment configuration (dry run)
        run: bun run check:workers
      - name: Save generated Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-generated-lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 3
      - name: One-time commit generated Bun lockfile to feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/cloudflare-workers-builds-git'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/chore/cloudflare-workers-builds-git:refs/remotes/origin/chore/cloudflare-workers-builds-git
          git checkout -B chore/cloudflare-workers-builds-git refs/remotes/origin/chore/cloudflare-workers-builds-git
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: add reproducible Bun lockfile'
            git push origin HEAD:refs/heads/chore/cloudflare-workers-builds-git
          fi
