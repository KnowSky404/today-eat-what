name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build H5 (root path)
        run: bun run build:h5
      - name: Build H5 (GitHub Pages subpath)
        run: |
          bun run build:pages
          grep -q '/today-eat-what/' dist/index.html
      - name: Install Chinese fonts for visual snapshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install browsers for runtime smoke test
        run: bunx playwright install chromium firefox
      - name: Browser smoke test (Chromium & Firefox)
        run: bun run smoke:h5
      - name: Upload responsive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-screenshots
          path: artifacts/layout/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build WeChat Mini Program
        run: bun run build:weapp

  workers-build:
    name: Validate Cloudflare Workers Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun ci
      - name: Build Workers H5 (root path)
        run: |
          bun run build:workers
          test -f dist/index.html
          grep -q '/js/' dist/index.html
          if grep -q '/today-eat-what/js/' dist/index.html; then
            echo 'Workers assets must use root paths, not GitHub Pages paths.' >&2
            exit 1
          fi
      - name: Validate Worker deployment configuration (dry run)
        run: bun run check:workers
