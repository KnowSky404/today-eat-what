name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Rebuild, verify and publish Pages from main
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Check diff and select validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the scope policy
        run: node --test .github/scripts/check-ci-scope.mjs
      - name: Inspect integration diff
        id: scope
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if [[ "$(git rev-parse --verify HEAD^2 2>/dev/null)" == "$PR_HEAD" ]]; then
                base=$(git rev-parse HEAD^1)
              fi
              ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          profile=full
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$base" HEAD; then
            git diff --check "$base" HEAD
            # The base owns the skip policy, including when the PR edits that policy.
            if git show "$base:.github/scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs" 2>/dev/null; then
              profile=$(node "$RUNNER_TEMP/ci-scope.mjs" "$base")
            fi
          else
            git show --format= --check HEAD
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          {
            echo "Profile: $profile"
            echo "Base: ${base:-unavailable}"
            echo "Checked commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify application and release inputs
    needs: scope
    if: needs.scope.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      pages_artifact: ${{ steps.pages.outputs.name }}
      pages_index_sha: ${{ steps.pages.outputs.index_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run typecheck
      - run: bun run test
      - name: Build and validate the root deployment
        run: |
          bun run build:workers
          grep -q '/js/' dist/index.html
          if grep -q '/today-eat-what/js/' dist/index.html; then
            echo 'Workers assets must use root paths.'
            exit 1
          fi
          bun run check:workers
      - name: Build GitHub Pages
        run: |
          bun run build:pages
          grep -q '/today-eat-what/js/' dist/index.html
      - name: Install Chinese fonts for visual snapshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Ensure Chromium and Firefox are installed
        run: bunx --no-install playwright install chromium firefox
      - name: Browser smoke test
        run: bun run smoke:h5
      - name: Keep responsive browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-browser-screenshots-${{ github.run_attempt }}
          path: artifacts/layout/
          if-no-files-found: ignore
          retention-days: 7
      - run: bun run build:weapp
      - run: bun run smoke:weapp
      - name: Identify the verified Pages build
        id: pages
        run: |
          index_sha=$(sha256sum dist/index.html | cut -d ' ' -f 1)
          echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "index_sha=$index_sha" >> "$GITHUB_OUTPUT"
          echo "Pages index SHA-256: $index_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: ${{ steps.pages.outputs.name }}
          path: dist
          retention-days: 7

  required:
    name: Required checks
    needs: [scope, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable result
        env:
          SCOPE: ${{ needs.scope.result }}
          PROFILE: ${{ needs.scope.outputs.profile }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          if [[ "$SCOPE" == success ]]; then
            case "$PROFILE:$VERIFY" in
              docs:skipped|full:success) exit 0 ;;
            esac
          fi
          echo "::error::Validation incomplete (scope=$SCOPE, profile=$PROFILE, verify=$VERIFY)"
          exit 1

  pages:
    needs: [required, verify]
    if: needs.required.result == 'success' && needs.verify.outputs.pages_artifact != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_pages)
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      artifact_name: ${{ needs.verify.outputs.pages_artifact }}
      index_sha: ${{ needs.verify.outputs.pages_index_sha }}
