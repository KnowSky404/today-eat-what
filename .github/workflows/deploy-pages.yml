name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
      index_sha:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages-production
  queue: max
  cancel-in-progress: false

jobs:
  current:
    name: Check Pages candidate freshness
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.freshness.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with current main
        id: freshness
        run: |
          git show "$GITHUB_SHA:.github/scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs"
          if [[ "$(node "$RUNNER_TEMP/ci-scope.mjs" "$GITHUB_SHA")" == docs ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Candidate is superseded or current-main equivalence could not be verified.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Publish verified Pages artifact
    needs: current
    if: needs.current.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ inputs.artifact_name }}
      - name: Verify the deployed HTML
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEX_SHA: ${{ inputs.index_sha }}
        run: |
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 10 "${PAGE_URL}?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/pages-index.html" &&
              echo "$INDEX_SHA  $RUNNER_TEMP/pages-index.html" | sha256sum --check --status; then
              echo "Verified Pages HTML for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Live Pages HTML does not match the verified artifact'
          exit 1
